name: Deploy MoveCar SaaS Web

on:
  push:
    branches:
      - main
    paths:
      - 'saas-web/**'
      - '.github/workflows/deploy-saas-web.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'saas-web/**'
      - '.github/workflows/deploy-saas-web.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest # guard: allow public repository uses hosted runner for untrusted PR isolation
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: https://movecar.fixture.invalid
      BETTER_AUTH_SECRET: synthetic-ci-auth-secret-with-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: movecar_launch_test
          POSTGRES_USER: movecar_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --memory=512m
          --publish 127.0.0.1::5432
          --health-cmd "pg_isready -U movecar_test -d movecar_launch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: saas-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('saas-web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Configure isolated database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          binding="$(docker port "$POSTGRES_CONTAINER_ID" 5432/tcp)"
          if [[ ! "$binding" =~ ^127\.0\.0\.1:([0-9]+)$ ]]; then
            echo 'PostgreSQL must have exactly one loopback-only port binding.' >&2
            exit 1
          fi
          database_url="postgresql://movecar_test@127.0.0.1:${BASH_REMATCH[1]}/movecar_launch_test"
          printf 'DATABASE_URL=%s\nMOVECAR_PAYMENT_TEST_DATABASE_URL=%s\n' "$database_url" "$database_url" >> "$GITHUB_ENV"

      - name: Generate Drizzle client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Initialize isolated database schema
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          database = urlparse(os.environ['MOVECAR_PAYMENT_TEST_DATABASE_URL'])
          assert database.hostname == '127.0.0.1'
          assert database.path == '/movecar_launch_test'
          assert not database.password
          assert os.environ['DATABASE_URL'] == database.geturl()
          PY
          npm run db:push -- --force

      - name: Payment contracts and PostgreSQL integration
        run: |
          set -euo pipefail
          : "${MOVECAR_PAYMENT_TEST_DATABASE_URL:?Isolated payment database is required}"
          NODE_OPTIONS=--conditions=react-server ./node_modules/.bin/tsx --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=payment-test-results.xml \
            lib/paibao-pay/core.test.ts lib/paibao-pay/config.test.ts lib/paibao-pay/db.test.ts
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('payment-test-results.xml').getroot()
          cases = list(report.iter('testcase'))
          assert cases, 'No payment tests were executed'
          assert not list(report.iter('skipped')), 'Payment tests must not be skipped'
          assert not list(report.iter('failure')), 'Payment tests failed'
          assert not list(report.iter('error')), 'Payment tests errored'
          database_cases = [case for case in cases if case.attrib.get('name') ==
              'Waffo database reservations, channel snapshots and signed deliveries remain isolated and idempotent']
          assert len(database_cases) == 1, 'PostgreSQL payment integration test must execute'
          print(f'Verified {len(cases)} payment tests including PostgreSQL, with zero skips')
          PY

      - name: Request database lifecycle
        run: ./node_modules/.bin/tsx --test lib/db/request.test.ts

      - name: Materialize runtime configuration
        if: github.ref == 'refs/heads/main'
        env:
          MOVECAR_RUNTIME_ENV: ${{ secrets.MOVECAR_RUNTIME_ENV }}
          MOVECAR_RUNTIME_DIRECTORY: ${{ runner.temp }}/movecar-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/prepare-cloudflare-runtime.mjs

      - name: Configure public build settings
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const {vars} = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          for (const [key,value] of Object.entries(vars)) {
            if (!key.startsWith('NEXT_PUBLIC_')) continue;
            if (typeof value !== 'string' || /[\r\n]/.test(value)) throw new Error('Invalid public build configuration');
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          JS

      - name: Cloudflare build with synthetic configuration
        run: npm run cf:build

      - name: Cloudflare artifact validation
        run: |
          ./node_modules/.bin/wrangler versions upload --dry-run --outdir .open-next/validated
          node scripts/prepare-cloudflare-artifact.mjs

      - name: Cloudflare workerd with isolated PostgreSQL
        env:
          MOVECAR_LOCAL_START_TIMEOUT_MS: '120000'
          MOVECAR_LOCAL_REQUEST_TIMEOUT_MS: '30000'
          MOVECAR_LOCAL_SHUTDOWN_TIMEOUT_MS: '10000'
        run: node scripts/smoke-cloudflare-local.mjs

      - name: Deploy verified Cloudflare artifact
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOVECAR_DEPLOY_TIMEOUT_MS: '120000'
          MOVECAR_SMOKE_TIMEOUT_MS: '30000'
        run: node scripts/deploy-cloudflare.mjs

      - name: Remove runtime configuration
        if: always() && github.ref == 'refs/heads/main'
        env:
          MOVECAR_RUNTIME_DIRECTORY: ${{ runner.temp }}/movecar-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -f -- "$MOVECAR_RUNTIME_DIRECTORY/secrets.json"
